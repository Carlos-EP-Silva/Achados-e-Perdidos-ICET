<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Senha - ICET/UFAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-ufam-gradient d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4" style="max-width: 400px; width: 90%; border-radius: 15px;">
        <div class="text-center mb-4">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="bi bi-key-fill text-success fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Nova Senha</h3>
            <p class="text-muted small">Digite e confirme sua nova senha de acesso</p>
        </div>
        
        <form id="formRedefinir">
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="novaSenha" placeholder="Senha" required minlength="6">
                <label for="novaSenha">Nova Senha (mínimo 6 caracteres)</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="confirmarSenha" placeholder="Confirmar" required>
                <label for="confirmarSenha">Confirmar Nova Senha</label>
            </div>

            <button type="submit" class="btn btn-ufam w-100 py-2 fs-5 fw-bold rounded-pill">Atualizar Senha</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/auth.js"></script>
</body>
</html>
