<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - ICET/UFAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-ufam-gradient d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4" style="max-width: 400px; width: 90%; border-radius: 15px;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-warning" style="font-size: 3rem;"></i>
            <h4 class="fw-bold text-dark mt-2">Recuperar Acesso</h4>
            <p class="text-muted small">Digite seu e-mail cadastrado. Enviaremos as instruções de recuperação.</p>
        </div>
        
        <form id="formRecuperar">
            <div class="form-floating mb-4">
                <input type="email" class="form-control" id="recEmail" placeholder="name@example.com" required>
                <label for="recEmail">E-mail Institucional</label>
            </div>
            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold rounded-pill text-dark">Enviar Link</button>
        </form>

        <div class="text-center mt-4">
            <a href="login.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar ao Login</a>
        </div>
    </div>

    <script src="script/auth.js"></script>
</body>
</html>
