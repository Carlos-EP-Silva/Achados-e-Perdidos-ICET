<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Achados & Perdidos - ICET/UFAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-ufam-gradient d-flex align-items-center justify-content-center vh-100">

    <div class="card border-0 shadow-lg p-4" style="max-width: 400px; width: 90%; border-radius: 15px;">
        <div class="text-center mb-3 mt-2">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="bi bi-person-fill text-success fs-1"></i>
            </div>
            <h3 class="fw-bold text-dark">Acesso ao Sistema</h3>
            <p class="text-muted small mb-0">Faça login com seu email institucional</p>
        </div>
        
        <div class="alert alert-success py-2 mb-4" role="alert" style="font-size: 0.85rem; border-radius: 10px;">
            <div class="fw-bold text-center mb-2 text-success"><i class="bi bi-info-circle-fill"></i> Contas de Teste (Senha: 123456)</div>
            <div class="d-flex flex-column gap-1 text-dark">
                <span>⚙️ <strong>Admin:</strong> admin@ufam.edu.br</span>
                <span>👮‍♂️ <strong>Guarda:</strong> guarda1@ufam.edu.br</span>
                <span>🎓 <strong>Aluno:</strong> aluno@ufam.edu.br</span>
            </div>
        </div>
        
        <form id="formLogin">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email</label>
            </div>
            
            <div class="form-floating mb-2">
                <input type="password" class="form-control" id="senha" placeholder="Password" required>
                <label for="senha">Senha</label>
            </div>

            <div class="text-end mb-4">
                <a href="recuperar.html" class="text-decoration-none text-success small fw-bold">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn btn-ufam w-100 py-2 fs-5 fw-bold rounded-pill">Entrar</button>
        </form>

        <div class="text-center mt-4">
            <a href="cadastro.html" class="text-decoration-none text-success fw-bold small">Primeiro acesso? Cadastre-se aqui</a>
            <hr class="my-3 text-muted">
            <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar ao acervo</a>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-danger border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Erro</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/auth.js"></script>
</body>
</html>
